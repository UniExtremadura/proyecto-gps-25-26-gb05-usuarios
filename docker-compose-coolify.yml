services:
  usuarios:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: usuarios
    restart: always
    environment:
      PORT: ${PORT}

      POSTGRESQL_HOST: usuarios-postgres
      POSTGRESQL_PORT: 5432
      POSTGRESQL_USERNAME: ${POSTGRESQL_USERNAME}
      POSTGRESQL_PASSWORD: ${POSTGRESQL_PASSWORD}
      POSTGRESQL_DATABASE: ${POSTGRESQL_DATABASE}

      SUPABASE_PROJECT_URL: ${SUPABASE_PROJECT_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      SERVICE_AUTH_EMAIL: ${SERVICE_AUTH_EMAIL}
      SERVICE_AUTH_PASSWORD: ${SERVICE_AUTH_PASSWORD}

      CONTENIDOS_SERVICE_BASE_URL: ${CONTENIDOS_SERVICE_BASE_URL}
      COMPRAS_SERVICE_BASE_URL: ${COMPRAS_SERVICE_BASE_URL}
      ESTADISTICAS_SERVICE_BASE_URL: ${ESTADISTICAS_SERVICE_BASE_URL}
    depends_on:
      - usuarios-postgres
    networks:
      usuarios:

  usuarios-postgres:
    image: postgres:17.6-alpine
    container_name: usuarios-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRESQL_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRESQL_PASSWORD}
      POSTGRES_DB: ${POSTGRESQL_DATABASE}
    volumes:
      - usuarios-postgres-data:/var/lib/postgresql/data
    networks:
      usuarios:

volumes:
  usuarios-postgres-data:

networks:
  usuarios: